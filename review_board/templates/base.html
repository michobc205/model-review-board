<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Model Review Board{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="{{ url_for('main.dashboard') }}">Model Review Board</a>
      <nav>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a class="button small" href="{{ url_for('main.new_review') }}">New review</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">
    <p>A small review tool for model predictions. Times are shown in UTC.</p>
  </footer>
</body>
</html>
