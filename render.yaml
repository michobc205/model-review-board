# Render Blueprint: one web service and one PostgreSQL database, both on the FREE plan.
#
# Free web services spin down after 15 minutes without traffic, and their
# filesystem is ephemeral. That is why the reviews live in the database and
# never in a local file. Free PostgreSQL databases expire 30 days after creation.
#
# No secret is written here: DATABASE_URL is wired from the database by Render,
# and SECRET_KEY is generated by Render.

databases:
  - name: review-board-db
    databaseName: review_board
    user: review_board
    plan: free
    region: frankfurt

services:
  - type: web
    name: model-review-board
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # init-db only creates missing tables, so it is safe to run at every start.
    startCommand: flask --app review_board init-db && gunicorn "review_board:create_app()" --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: DATABASE_URL
        fromDatabase:
          name: review-board-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
